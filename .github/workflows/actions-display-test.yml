
name: ZFile 旧版工作流回归测试

on:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "1. 检出仓库"
        uses: actions/checkout@v6

      - name: "2. 显示 Runner 信息"
        run: |
          echo "开始检查 Runner"
          echo "系统：$RUNNER_OS"
          echo "架构：$RUNNER_ARCH"
          echo "仓库：$GITHUB_REPOSITORY"
          echo "运行编号：$GITHUB_RUN_ID"
          uname -a
          echo "Runner 检查完成"

      - name: "3. 检查基础工具"
        run: |
          set -e
          echo "检查 Git"
          git --version
          echo "检查 curl"
          curl --version | head -n 1
          echo "检查 Docker"
          docker --version
          echo "基础工具检查完成"

      - name: "4. 检查工作目录"
        run: |
          echo "当前工作目录：$(pwd)"
          echo "仓库文件："
          ls -lah
          echo "工作目录检查完成"

      - name: "5. 检查 GitHub 环境"
        run: |
          echo "事件：$GITHUB_EVENT_NAME"
          echo "分支：$GITHUB_REF_NAME"
          echo "提交：$GITHUB_SHA"
          echo "Job：$GITHUB_JOB"
          echo "GitHub 环境检查完成"

      - name: "6. 测试独立步骤日志"
        run: |
          echo "开始实时日志测试"
          for i in {1..10}; do
            echo "$(date '+%F %T') | 实时日志 $i/10"
            sleep 2
          done
          echo "实时日志测试完成"

      - name: "7. 检查官方 ZFile 目录"
        run: |
          set -e
          echo "开始检查官方目录"
          curl -fIL --retry 2 --max-time 30 \
            https://c.jun6.net/ZFILE-PRO/
          echo "官方目录检查完成"

      - name: "8. 测试步骤分组日志"
        run: |
          echo "::group::环境信息"
          echo "Runner：$RUNNER_NAME"
          echo "系统：$RUNNER_OS"
          echo "架构：$RUNNER_ARCH"
          echo "::endgroup::"

          echo "::group::仓库信息"
          echo "仓库：$GITHUB_REPOSITORY"
          echo "分支：$GITHUB_REF_NAME"
          echo "::endgroup::"

      - name: "9. 测试成功状态"
        run: |
          echo "SUCCESS | 独立步骤执行成功"

      - name: "10. 输出最终结果"
        if: always()
        run: |
          echo "================================"
          echo "ZFile 旧版工作流回归测试完成"
          echo "运行编号：$GITHUB_RUN_ID"
          echo "Job 状态：${{ job.status }}"
          echo "================================"
