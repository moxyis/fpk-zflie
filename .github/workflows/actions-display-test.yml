
name: GitHub Actions 独立步骤显示诊断

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-multi-arch:
    name: 实时步骤日志测试
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "1. 检出仓库"
        uses: actions/checkout@v4

      - name: "2. 初始化环境"
        run: |
          echo "开始初始化环境"
          echo "Runner: $RUNNER_OS"
          echo "仓库: $GITHUB_REPOSITORY"
          echo "初始化完成"

      - name: "3. 读取 ZFile 官方版本"
        run: |
          set -euo pipefail
          echo "开始读取官方版本目录"

          curl -fLsS --max-time 30 \
            https://c.jun6.net/ZFILE-PRO/ \
            -o /tmp/zfile-index.html

          grep -Eo 'zfile-pro-[0-9]+\.[0-9]+\.[0-9]+-fnos-(x86|arm)\.fpk' \
            /tmp/zfile-index.html | sort -u

          echo "官方版本检查完成"

      - name: "4. 测试实时日志"
        run: |
          for i in {1..10}; do
            echo "$(date '+%F %T') | 实时日志 $i/10"
            sleep 2
          done

      - name: "5. 输出测试结果"
        if: always()
        run: |
          echo "所有测试步骤已结束"
          echo "运行编号：${{ github.run_id }}"
          echo "Job：${{ github.job }}"
