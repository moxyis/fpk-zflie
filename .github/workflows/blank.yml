
name: Actions 实时步骤显示测试

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: "1. 读取官方版本号"
        shell: bash
        run: |
          set -euo pipefail
          echo "开始读取官方版本..."
          curl -fLsS --max-time 30 \
            https://c.jun6.net/ZFILE-PRO/ \
            -o /tmp/zfile-index.html
          echo "官方目录读取成功"
          grep -Eo 'zfile-pro-[0-9]+\.[0-9]+\.[0-9]+-fnos-(x86|arm)\.fpk' \
            /tmp/zfile-index.html | sort -u

      - name: "2. 测试实时日志输出"
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "$(date '+%F %T') | 正在执行第 $i 次检查"
            sleep 2
          done
          echo "实时日志测试完成"

      - name: "3. 测试成功状态"
        run: |
          echo "SUCCESS | 步骤执行成功"
