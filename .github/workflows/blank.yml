name: ZFile 官方 FPK 监控与分发

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'debug=只检测下载; production=正式发布'
        required: true
        type: choice
        default: debug
        options: [debug, production]
      force_check:
        description: '即使版本已发布也重新下载验证（不会覆盖发布）'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: zfile-fpk-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_DIR: https://c.jun6.net/ZFILE-PRO/
  APP_ID: fpk-zflie
  FNDEPOT_REPO: moxyis/FnDepot
  FNDEPOT_BRANCH: main
  # 定时任务默认 production；手动默认 debug
  RUN_MODE: ${{ github.event_name == 'schedule' && 'production' || inputs.run_mode }}
  FORCE_CHECK: ${{ inputs.force_check || false }}
  GH_TOKEN: ${{ github.token }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 01. 检出监控仓库
        uses: actions/checkout@v6

      - name: 02. 安装工具
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq unzip file

      - name: 03. 初始化运行日志
        shell: bash
        run: |
          mkdir -p logs dist
          echo "$(TZ=Asia/Shanghai date '+%F %T %Z') | INFO | run=$GITHUB_RUN_ID mode=$RUN_MODE | 监控开始" > logs/monitor.log
          echo "run_id=$GITHUB_RUN_ID" > logs/metadata.txt
          echo "source=$SOURCE_DIR" >> logs/metadata.txt
          echo "mode=$RUN_MODE" >> logs/metadata.txt

      - name: 04. 发现官方最新双架构 FPK
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee -a "logs/monitor.log") 2> >(tee -a "logs/monitor.log" >&2)
          STEP_NAME="发现官方最新双架构 FPK"
          echo "$(TZ=Asia/Shanghai date '+%F %T CST') | START | ${STEP_NAME}"
          on_step_error() {
            local code=$?
            trap - ERR
            printf "%s | ERROR | step=%s | exit=%s | line=%s\n" "$(TZ=Asia/Shanghai date "+%F %T CST")" "${STEP_NAME:-unknown}" "$code" "${BASH_LINENO[0]:-unknown}" >&2
            exit "$code"
          }
          trap 'on_step_error' ERR
          mkdir -p dist
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            --silent --show-error "$SOURCE_DIR" -o dist/index.html

          # 从 HTML 目录索引中提取文件名，不假设 href 顺序或固定 HTML 布局。
          grep -Eo 'zfile-pro-[0-9]+\.[0-9]+\.[0-9]+-fnos-(x86|arm)\.fpk' dist/index.html \
            | sort -u > dist/files.txt || true
          if [[ ! -s dist/files.txt ]]; then
            echo '错误：官方目录没有找到符合命名规则的 FPK。' >&2
            exit 1
          fi
          echo '官方文件列表：'
          cat dist/files.txt

          # 仅接受两个架构都存在的最新版本。
          cut -d- -f3 dist/files.txt | sort -Vu > dist/versions.txt
          VERSION=''
          while IFS= read -r candidate; do
            if grep -Fxq "zfile-pro-${candidate}-fnos-x86.fpk" dist/files.txt \
              && grep -Fxq "zfile-pro-${candidate}-fnos-arm.fpk" dist/files.txt; then
              VERSION="$candidate"
              break
            fi
          done < <(sort -Vr dist/versions.txt)
          if [[ -z "$VERSION" ]]; then
            echo '错误：没有找到同版本的 x86 和 ARM 安装包。' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "发现可配对版本：$VERSION"

      - name: 05. 检查现有 GitHub Release
        id: release
        shell: bash
        env:
          TAG: ${{ steps.discover.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee -a "logs/monitor.log") 2> >(tee -a "logs/monitor.log" >&2)
          STEP_NAME="检查现有 GitHub Release"
          echo "$(TZ=Asia/Shanghai date '+%F %T CST') | START | ${STEP_NAME}"
          on_step_error() {
            local code=$?
            trap - ERR
            printf "%s | ERROR | step=%s | exit=%s | line=%s\n" "$(TZ=Asia/Shanghai date "+%F %T CST")" "${STEP_NAME:-unknown}" "$code" "${BASH_LINENO[0]:-unknown}" >&2
            exit "$code"
          }
          trap 'on_step_error' ERR
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "已存在 $TAG，不覆盖原始文件。"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: 06. 下载并检查双架构 FPK
        id: download
        if: env.RUN_MODE == 'debug' || steps.release.outputs.exists != 'true' || env.FORCE_CHECK == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.discover.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee -a "logs/download.log") 2> >(tee -a "logs/download.log" >&2)
          STEP_NAME="下载并检查双架构 FPK"
          echo "$(TZ=Asia/Shanghai date '+%F %T CST') | START | ${STEP_NAME}"
          on_step_error() {
            local code=$?
            trap - ERR
            printf "%s | ERROR | step=%s | exit=%s | line=%s\n" "$(TZ=Asia/Shanghai date "+%F %T CST")" "${STEP_NAME:-unknown}" "$code" "${BASH_LINENO[0]:-unknown}" >&2
            exit "$code"
          }
          trap 'on_step_error' ERR
          for arch in x86 arm; do
            name="zfile-pro-${VERSION}-fnos-${arch}.fpk"
            url="${SOURCE_DIR}${name}"
            echo "下载 $url"
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              --silent --show-error "$url" -o "dist/${name}.part"
            test -s "dist/${name}.part"
            # 避免下载到 200 HTML 错误页。
            if head -c 512 "dist/${name}.part" | grep -Eaiq '<!doctype html|<html'; then
              echo "错误：$name 返回 HTML 而非安装包。" >&2
              exit 1
            fi
            # FPK 一般为归档格式；以 tar/unzip 能否列出内容作为基础完整性检查。
            if ! tar -tf "dist/${name}.part" >/dev/null 2>&1 \
              && ! unzip -tqq "dist/${name}.part" >/dev/null 2>&1; then
              echo "错误：$name 不是可识别的 tar/zip 包，需人工核对官方 FPK 格式。" >&2
              exit 1
            fi
            mv "dist/${name}.part" "dist/${name}"
          done
          (cd dist && sha256sum "zfile-pro-${VERSION}-fnos-x86.fpk" \
            "zfile-pro-${VERSION}-fnos-arm.fpk" > SHA256SUMS)
          cat dist/SHA256SUMS
          echo 'downloaded=true' >> "$GITHUB_OUTPUT"

      - name: 07. Debug 测试报告
        if: env.RUN_MODE == 'debug'
        shell: bash
        env:
          VERSION: ${{ steps.discover.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee -a "logs/monitor.log") 2> >(tee -a "logs/monitor.log" >&2)
          STEP_NAME="Debug 测试报告"
          echo "$(TZ=Asia/Shanghai date '+%F %T CST') | START | ${STEP_NAME}"
          on_step_error() {
            local code=$?
            trap - ERR
            printf "%s | ERROR | step=%s | exit=%s | line=%s\n" "$(TZ=Asia/Shanghai date "+%F %T CST")" "${STEP_NAME:-unknown}" "$code" "${BASH_LINENO[0]:-unknown}" >&2
            exit "$code"
          }
          trap 'on_step_error' ERR
          {
            echo '## ZFile FPK Debug 检测'
            echo "- 版本：${VERSION}"
            echo "- Release 已存在：${{ steps.release.outputs.exists }}"
            if [[ -f dist/SHA256SUMS ]]; then
              echo '### 本次下载 SHA-256'
              echo '```'
              cat dist/SHA256SUMS
              echo '```'
            else
              echo '- 已发布且未强制检查，跳过重复下载。'
            fi
            echo '- Debug 不会发布或修改仓库。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 08. 上传 Debug 校验结果
        if: env.RUN_MODE == 'debug' && steps.download.outputs.downloaded == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: zfile-debug-${{ steps.discover.outputs.version }}
          path: |
            dist/SHA256SUMS
            dist/files.txt
          retention-days: 7

      - name: 09. 检查正式分发条件
        if: env.RUN_MODE == 'production' && steps.release.outputs.exists != 'true'
        shell: bash
        env:
          FNDEPOT_PAT: ${{ secrets.FnDepot_PAT }}
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee -a "logs/publish.log") 2> >(tee -a "logs/publish.log" >&2)
          STEP_NAME="检查正式分发条件"
          echo "$(TZ=Asia/Shanghai date '+%F %T CST') | START | ${STEP_NAME}"
          on_step_error() {
            local code=$?
            trap - ERR
            printf "%s | ERROR | step=%s | exit=%s | line=%s\n" "$(TZ=Asia/Shanghai date "+%F %T CST")" "${STEP_NAME:-unknown}" "$code" "${BASH_LINENO[0]:-unknown}" >&2
            exit "$code"
          }
          trap 'on_step_error' ERR
          test -n "$FNDEPOT_PAT" || { echo '缺少 FnDepot_PAT Secret' >&2; exit 1; }
          test -s dist/SHA256SUMS
          echo '两个架构已下载；准备发布。'

      - name: 10. 正式发布 GitHub Release
        if: env.RUN_MODE == 'production' && steps.release.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.discover.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee -a "logs/publish.log") 2> >(tee -a "logs/publish.log" >&2)
          STEP_NAME="正式发布 GitHub Release"
          echo "$(TZ=Asia/Shanghai date '+%F %T CST') | START | ${STEP_NAME}"
          on_step_error() {
            local code=$?
            trap - ERR
            printf "%s | ERROR | step=%s | exit=%s | line=%s\n" "$(TZ=Asia/Shanghai date "+%F %T CST")" "${STEP_NAME:-unknown}" "$code" "${BASH_LINENO[0]:-unknown}" >&2
            exit "$code"
          }
          trap 'on_step_error' ERR
          gh release create "v${VERSION}" \
            "dist/zfile-pro-${VERSION}-fnos-x86.fpk" \
            "dist/zfile-pro-${VERSION}-fnos-arm.fpk" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZFile v${VERSION} 官方 fnOS FPK 镜像" \
            --notes "来源：${SOURCE_DIR}\n本 Release 原样分发官方 x86 / ARM FPK；SHA256SUMS 为镜像下载后的校验值。" \
            --latest

      - name: 11. 正式同步 FnDepot V2
        if: env.RUN_MODE == 'production'
        shell: bash
        env:
          VERSION: ${{ steps.discover.outputs.version }}
          FNDEPOT_PAT: ${{ secrets.FnDepot_PAT }}
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee -a "logs/publish.log") 2> >(tee -a "logs/publish.log" >&2)
          STEP_NAME="正式同步 FnDepot V2"
          echo "$(TZ=Asia/Shanghai date '+%F %T CST') | START | ${STEP_NAME}"
          on_step_error() {
            local code=$?
            trap - ERR
            printf "%s | ERROR | step=%s | exit=%s | line=%s\n" "$(TZ=Asia/Shanghai date "+%F %T CST")" "${STEP_NAME:-unknown}" "$code" "${BASH_LINENO[0]:-unknown}" >&2
            exit "$code"
          }
          trap 'on_step_error' ERR
          test -n "$FNDEPOT_PAT" || { echo '缺少 FnDepot_PAT Secret' >&2; exit 1; }
          # Release 可能在之前的运行中已创建；从 GitHub 下载可实现失败重试。
          mkdir -p /tmp/zfile-assets
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern "zfile-pro-${VERSION}-fnos-*.fpk" \
            --pattern SHA256SUMS --dir /tmp/zfile-assets
          (cd /tmp/zfile-assets && sha256sum -c SHA256SUMS)

          # 不把 Token 写入远端 URL，使用一次性 HTTP Header 进行认证。
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FNDEPOT_PAT" | base64 -w0)" \
            clone --depth 1 --branch "$FNDEPOT_BRANCH" \
            "https://github.com/${FNDEPOT_REPO}.git" /tmp/FnDepot
          cd /tmp/FnDepot
          test -f fnpack.json
          jq -e '.schema_version == "2" and (.apps | type == "object")' fnpack.json >/dev/null
          jq -e --arg app "$APP_ID" '.apps[$app] | type == "object"' fnpack.json >/dev/null

          mkdir -p "$APP_ID/versions"
          for arch in x86 arm; do
            name="zfile-pro-${VERSION}-fnos-${arch}.fpk"
            cp "/tmp/zfile-assets/$name" "$APP_ID/versions/$name"
          done
          X86="$APP_ID/versions/zfile-pro-${VERSION}-fnos-x86.fpk"
          ARM="$APP_ID/versions/zfile-pro-${VERSION}-fnos-arm.fpk"
          X86_SIZE=$(stat -c%s "$X86")
          ARM_SIZE=$(stat -c%s "$ARM")
          X86_SHA=$(sha256sum "$X86" | awk '{print $1}')
          ARM_SHA=$(sha256sum "$ARM" | awk '{print $1}')
          jq --arg app "$APP_ID" --arg ver "$VERSION" \
            --arg x86 "./$X86" --arg arm "./$ARM" \
            --arg xsha "$X86_SHA" --arg asha "$ARM_SHA" \
            --argjson xsize "$X86_SIZE" --argjson asize "$ARM_SIZE" '
            .apps[$app].platform = ["x86", "arm"] |
            .apps[$app].is_docker = false |
            .apps[$app].releases = (.apps[$app].releases // {}) |
            .apps[$app].releases[$ver] = {
              changelog: ("同步 ZFile 官方 fnOS FPK " + $ver),
              packages: {
                x86: {download_url: $x86, size: $xsize, sha256: $xsha},
                arm: {download_url: $arm, size: $asize, sha256: $asha}
              }
            }
          ' fnpack.json > fnpack.json.tmp
          jq -e --arg app "$APP_ID" --arg ver "$VERSION" \
            '.apps[$app].releases[$ver].packages | has("x86") and has("arm")' fnpack.json.tmp >/dev/null
          mv fnpack.json.tmp fnpack.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add fnpack.json "$APP_ID/versions/"
          if git diff --cached --quiet; then
            echo 'FnDepot 已同步，无需提交。'
            exit 0
          fi
          git commit -m "chore(zfile): sync official fnOS FPK v${VERSION}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FNDEPOT_PAT" | base64 -w0)" \
            push origin "HEAD:${FNDEPOT_BRANCH}"

      - name: 12. 归档运行日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zfile-monitor-logs-${{ github.run_id }}
          path: |
            logs/
            dist/files.txt
            dist/versions.txt
            dist/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30

      - name: 13. 输出运行总结
        if: always()
        shell: bash
        run: |
          {
            echo '## 运行信息'
            echo "- 模式：${RUN_MODE}"
            echo "- 官方目录：${SOURCE_DIR}"
            echo "- 最新配对版本：${{ steps.discover.outputs.version }}"
            echo "- Release 已存在：${{ steps.release.outputs.exists }}"
            echo "- 日志归档：zfile-monitor-logs-${GITHUB_RUN_ID}（保留 30 天）"
            echo "- 运行结果：${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
