
name: Actions 双仓库步骤对照测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "1. 检出仓库"
        uses: actions/checkout@v4

      - name: "2. 检查运行环境"
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS"
          echo "开始环境检查"
          uname -a
          echo "环境检查成功"

      - name: "3. 模拟版本检查"
        shell: bash
        run: |
          set -euo pipefail
          echo "开始检查版本"
          echo "官方版本: 5.1.0"
          echo "仓库版本: 5.0.0"
          echo "发现新版本"

      - name: "4. 测试实时日志"
        shell: bash
        run: |
          for i in {1..10}; do
            echo "$(date '+%F %T') | 执行进度 $i/10"
            sleep 2
          done
          echo "实时日志测试完成"

      - name: "5. 输出最终结果"
        if: always()
        shell: bash
        run: |
          echo "工作流执行结束"
          echo "状态: ${{ job.status }}"
